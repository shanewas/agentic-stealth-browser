[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-stealth-browser"
version = "2.7.0"
description = "Production-grade, human-mimicking browser automation framework for autonomous agents. Survives modern anti-bot systems."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Shane W", email = "shanewas@users.noreply.github.com"},
]
keywords = ["stealth", "browser", "automation", "playwright", "anti-bot", "scraping", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
    "Framework :: AsyncIO",
]
dependencies = [
    "playwright>=1.45",
    "aiohttp>=3.10.11",
    "cryptography>=43.0.1",
    "pyyaml>=6.0.2",
    "fastapi>=0.115.0",
    "jinja2>=3.1.5",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[project.scripts]
agentic-stealth-browser = "production.cli:main"

[tool.setuptools]
py-modules = ["mcp_security"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "core",
    "stealth",
    "sessions",
    "behavior",
    "recovery",
    "audit",
    "proxy",
    "production",
    "production.*",
    "scraping",
    "ai",
    "linkedin",
    "workflows",
    "workflows.*",
    "plugins",
    "plugins.*",
    "canary",
]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.toml", "*.cfg", "py.typed"]
"canary" = ["templates/*.j2"]

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = [
    "stealth.*",
    "behavior.*",
    "recovery.*",
    "sessions.*",
    "audit.*",
    "proxy.*",
    "production.*",
    "scraping.*",
    "ai.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["core.*"]
ignore_errors = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false
warn_return_any = false
check_untyped_defs = false

# ponytail: dynamic spine, ~86 mypy false-positives on runtime-set attrs; keep ignored until a typed refactor.
[[tool.mypy.overrides]]
module = ["core.agent_browser"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "production.approval_gate",
    "production.policy_engine",
    "production.mcp_input_validator",
    "production.mcp_session_isolation",
    "mcp_security",
]
ignore_errors = false
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false
disallow_incomplete_defs = false
check_untyped_defs = false
warn_return_any = false

[tool.ruff]
# Target Python 3.10+
target-version = "py310"

[tool.ruff.lint]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F841", "F811", "E712"]
"canary/tests/*" = ["E402", "F841", "F811", "E712"]
"scripts/*" = ["F841"]
"stealth/presets.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.bandit]
exclude_dirs = ["tests", "canary", "examples", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "e2e: marks tests as end-to-end (deselect with -m \"not e2e\")",
  "live_network: requires real network or external protected sites",
  "slow: slow or resource-heavy tests",
  "contract: interface/contract tests (pure logic, no browser)",
  "mcp: MCP server runtime, tools, and contract tests"
]

[project.urls]
Homepage = "https://github.com/shanewas/agentic-stealth-browser"
Repository = "https://github.com/shanewas/agentic-stealth-browser"
Issues = "https://github.com/shanewas/agentic-stealth-browser/issues"
Documentation = "https://github.com/shanewas/agentic-stealth-browser/tree/master/docs"
Changelog = "https://github.com/shanewas/agentic-stealth-browser/blob/master/CHANGELOG.md"
