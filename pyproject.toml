[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-stealth-browser"
version = "2.1.1"
description = "Production-grade, human-mimicking browser automation framework for autonomous agents. Survives modern anti-bot systems."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Shane W", email = "shanewas@users.noreply.github.com"},
]
keywords = ["stealth", "browser", "automation", "playwright", "anti-bot", "scraping", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
    "Framework :: AsyncIO",
]
dependencies = [
    "playwright",
    "aiohttp",
    "cryptography",
    "pyyaml",
    "fastapi",
    "jinja2",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
]

[project.scripts]
agentic-stealth-browser = "production.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "core",
    "stealth",
    "sessions",
    "behavior",
    "recovery",
    "audit",
    "proxy",
    "production",
    "scraping",
    "ai",
    "linkedin",
    "workflows",
]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.toml", "*.cfg", "py.typed"]

[tool.ruff]
# Target Python 3.10+
target-version = "py310"

[tool.ruff.lint]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F841", "F811", "E712"]
"scripts/*" = ["F841"]
"stealth/presets.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "e2e: marks tests as end-to-end (deselect with -m \"not e2e\")",
  "live_network: requires real network or external protected sites",
  "slow: slow or resource-heavy tests",
  "contract: interface/contract tests (pure logic, no browser)",
  "mcp: MCP server runtime, tools, and contract tests"
]

[project.urls]
Homepage = "https://github.com/shanewas/agentic-stealth-browser"
Repository = "https://github.com/shanewas/agentic-stealth-browser"
Issues = "https://github.com/shanewas/agentic-stealth-browser/issues"
Documentation = "https://github.com/shanewas/agentic-stealth-browser/tree/master/docs"
Changelog = "https://github.com/shanewas/agentic-stealth-browser/blob/master/CHANGELOG.md"
