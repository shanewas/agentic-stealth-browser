# GitHub Actions job stub for E2E protected sites placeholder.
# Added as part of safely closing #256 and #125.
# The test file is skipped by default to prevent loops on live protected sites.
#
# See:
# - https://github.com/shanewas/agentic-stealth-browser/issues/256
# - https://github.com/shanewas/agentic-stealth-browser/issues/125

name: E2E Protected Sites (Stub)

on:
  workflow_dispatch:  # Manual trigger for now
  # TODO: add schedule or PR trigger once real E2E is safe (see issues)

jobs:
  e2e-protected-placeholder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps (minimal)
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # Add project deps if needed: pip install -e .[test] or similar

      - name: Run placeholder test (expected: skipped)
        run: |
          python -m pytest tests/test_e2e_protected_sites_placeholder.py -q --tb=short
        # The @skip ensures this never hits real protected sites in CI.
        # Future: gate behind env var like RUN_E2E_PROTECTED=1 and remove skip.
