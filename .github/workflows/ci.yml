name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy 'bandit==1.7.9'

      - name: Run ruff check (blocking)
        run: ruff check .

      - name: Run ruff format check (blocking)
        run: ruff format --check .

      - name: Run mypy (blocking, core/)
        run: mypy core/ --ignore-missing-imports --exclude 'tests'

      - name: Run mypy on security modules (blocking)
        run: mypy production/approval_gate.py production/policy_engine.py production/mcp_input_validator.py production/mcp_session_isolation.py mcp_security.py --ignore-missing-imports

      - name: Run bandit SAST (blocking, baseline-ratcheted)
        run: bandit -r core stealth behavior recovery sessions audit proxy production scraping ai plugins workflows mcp_security.py --severity-level medium --confidence-level medium -b bandit-baseline.json

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit lockfile for known CVEs (blocking)
        run: python -m pip_audit -r requirements.lock --require-hashes

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"

      - name: Install project with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
          playwright install --with-deps chromium

      - name: Run tests with coverage
        run: |
          # ratchet: +5 each release, never lower
          python -m pytest tests/ \
            -m "not e2e and not live_network" \
            --ignore=tests/test_basic.py \
            -q --tb=short \
            --cov=core --cov=stealth --cov=behavior --cov=recovery --cov=proxy --cov=production --cov=sessions --cov=workflows --cov=audit --cov=mcp_security \
            --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=55
        env:
          PYTEST_ADDOPTS: "-p no:timeout"

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: |
            *.xml
            tests/detection_results*.json
            tests/detection_history.json
          retention-days: 30

      - name: Test Collection Audit
        if: always()
        run: |
          python -m pytest tests/ --collectonly -q -m "not e2e and not live_network" --tb=no > test-collection-audit.txt 2>&1 || true
          echo "Collected $(wc -l < test-collection-audit.txt) lines"
        continue-on-error: true

      - name: Upload collection audit artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-collection-audit
          path: test-collection-audit.txt
          retention-days: 30

  build:
    name: Build / Docker smoke test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
          playwright install chromium

      - name: Verify core imports
        run: |
          python -c "from core.agent_browser import AgentBrowser; from stealth.advanced_stealth import get_stealth_script; from sessions.cookie_manager import CookieManager; print('OK')"

      - name: Docker build smoke test
        if: runner.os == 'Linux'
        run: |
          docker build -t agentic-stealth-browser:ci-check -f production/Dockerfile .
          echo "Docker build succeeded"

      - name: Docker healthcheck test
        if: runner.os == 'Linux'
        run: |
          docker run --rm agentic-stealth-browser:ci-check python -c "from core.agent_browser import AgentBrowser; print('Runtime OK')"

  nightly-detection:
    name: Nightly detection testing
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
          playwright install --with-deps chromium

      - name: Run detection tests
        run: |
          python -m pytest tests/ --ignore=tests/test_recovery_phase1.py -q --tb=short
        env:
          PYTEST_ADDOPTS: "-p no:timeout"

      # soft canary: live detection may flake; failures surfaced via continue-on-error, not hard-blocking
      - name: Run nightly detection runner
        run: |
          python tests/run_detection_tests.py || echo "Detection tests completed with warnings"
        continue-on-error: true
