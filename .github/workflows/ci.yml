name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run ruff check (blocking)
        run: ruff check .

      - name: Run ruff format check (blocking)
        run: ruff format --check .

      - name: Run mypy gradual type checking (non-blocking, informative)
        run: mypy core/ --ignore-missing-imports --exclude 'tests' || true
        continue-on-error: true

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-cov
          playwright install --with-deps chromium

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            -m "not e2e and not live_network" \
            --ignore=tests/test_recovery_phase1.py \
            --ignore=tests/test_basic.py \
            --ignore=tests/test_phase7_fixes.py \
            -q --tb=short \
            --cov=core --cov=stealth --cov=behavior --cov=recovery --cov=proxy --cov=production \
            --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=45
        env:
          PYTEST_ADDOPTS: "-p no:timeout"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            *.xml
            tests/detection_results*.json
            tests/detection_history.json
          retention-days: 30

      - name: Test Collection Audit
        if: always()
        run: |
          python -m pytest tests/ --collectonly -q -m "not e2e and not live_network" --tb=no > test-collection-audit.txt 2>&1 || true
          echo "Collected $(wc -l < test-collection-audit.txt) lines"
        continue-on-error: true

      - name: Upload collection audit artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-collection-audit
          path: test-collection-audit.txt
          retention-days: 30

  build:
    name: Build / Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          playwright install --with-deps chromium

      - name: Verify core imports
        run: |
          python -c "from core.agent_browser import AgentBrowser; from stealth.advanced_stealth import get_stealth_script; from sessions.cookie_manager import CookieManager; print('OK')"

      - name: Docker build smoke test
        run: |
          docker build -t agentic-stealth-browser:ci-check -f production/Dockerfile .
          echo "Docker build succeeded"

      - name: Docker healthcheck test
        run: |
          docker run --rm agentic-stealth-browser:ci-check python -c "from core.agent_browser import AgentBrowser; print('Runtime OK')"

  nightly-detection:
    name: Nightly detection testing
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          playwright install --with-deps chromium

      - name: Run detection tests
        run: |
          python -m pytest tests/ --ignore=tests/test_recovery_phase1.py -q --tb=short
        env:
          PYTEST_ADDOPTS: "-p no:timeout"

      # soft canary: live detection may flake; failures surfaced via continue-on-error, not hard-blocking
      - name: Run nightly detection runner
        run: |
          python tests/run_detection_tests.py || echo "Detection tests completed with warnings"
        continue-on-error: true
