name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 ruff

      - name: Run flake8 (critical errors — blocking)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Critical error classes (syntax, undefined names, etc.) are now blocking.
        # Broader style/complexity checks below remain non-blocking during Phase 8 cleanup.

      - name: Run flake8 (style/complexity — non-blocking for now)
        run: |
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

      - name: Run ruff check (non-blocking during tech-debt cleanup)
        run: ruff check . || true
        continue-on-error: true

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-cov
          playwright install --with-deps chromium

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_recovery_phase1.py \
            --ignore=tests/test_basic.py \
            --ignore=tests/test_mcp_contract.py \
            --ignore=tests/test_e2e_anti_block_recovery.py \
            --ignore=tests/test_e2e_protected_sites_placeholder.py \
            --ignore=tests/test_phase7_fixes.py \
            -q --tb=short \
            --cov=core --cov=stealth --cov=behavior --cov=recovery --cov=proxy --cov=production \
            --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=65
        env:
          PYTEST_ADDOPTS: "-p no:timeout"
        # Coverage threshold (65%) is now enforced. Raise this over time as we improve coverage.
        # The ignored E2E tests are the known flaky Cloudflare ones; core unit tests must pass cleanly.

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            *.xml
            tests/detection_results*.json
            tests/detection_history.json
          retention-days: 30

  build:
    name: Build / Import smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          playwright install --with-deps chromium

      - name: Verify core imports
        run: |
          python -c "from core.agent_browser import AgentBrowser; from stealth.advanced_stealth import get_stealth_script; from sessions.cookie_manager import CookieManager; print('OK')"

  nightly-detection:
    name: Nightly detection testing
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          playwright install --with-deps chromium

      - name: Run detection tests
        run: |
          python -m pytest tests/ --ignore=tests/test_recovery_phase1.py -q --tb=short || true
        env:
          PYTEST_ADDOPTS: "-p no:timeout"

      - name: Run nightly detection runner
        run: |
          python tests/run_detection_tests.py || echo "Detection tests completed with warnings"
        continue-on-error: true